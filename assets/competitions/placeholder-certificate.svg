<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Certificate placeholder">
  <style>
    .bg    { fill: #f4f5f7; }
    .disc  { fill: #e4e6ea; }
    .rule  { stroke: #c3c7cf; }
    .seal  { fill: #b0b5bf; }
    .label { fill: #5f6570; }
    .hint  { fill: #9aa0aa; }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #171a20; }
      .disc  { fill: #232730; }
      .rule  { stroke: #3a3f4a; }
      .seal  { fill: #5b6270; }
      .label { fill: #9aa0aa; }
      .hint  { fill: #6b7280; }
    }
  </style>
  <rect class="bg" width="1200" height="800"/>
  <rect class="disc" x="520" y="250" width="160" height="200" rx="8"/>
  <path class="rule" d="M560 300h80M560 340h80M560 380h56" stroke-width="8" stroke-linecap="round"/>
  <circle class="disc" cx="600" cy="470" r="34"/>
  <path class="seal" d="M600 456l6 12 13 2-9 9 2 13-12-6-12 6 2-13-9-9 13-2z"/>
  <text class="label" x="600" y="580" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="40" font-weight="600">Award Certificate</text>
  <text class="hint" x="600" y="618" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="25">add assets/competitions/&lt;name&gt;-certificate.jpg</text>
</svg>
